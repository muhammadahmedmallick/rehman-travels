name: rehman_mobile_app
description: "Rehman Travels - Flight Booking Mobile App"
publish_to: 'none'

version: 1.0.0+1

environment:
    sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^17.0.1

  # Network
  dio: ^5.4.3+1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # Local Storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase Auth
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  google_sign_in: ^7.2.0

  # PDF
  pdf: ^3.11.2
  printing: ^5.13.5
  path_provider: ^2.1.5
  webview_flutter: ^4.12.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#1A1B4B"
  adaptive_icon_foreground: "assets/icons/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#1A1B4B"
  web:
    generate: true
    image_path: "assets/icons/logo.png"
    background_color: "#1A1B4B"
    theme_color: "#1A1B4B"

flutter_native_splash:
  color: "#1A1B4B"
  image: "assets/icons/splash_logo.png"
  android_12:
    color: "#1A1B4B"
    image: "assets/icons/splash_logo.png"
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/stories/

  # Fonts are loaded via google_fonts package at runtime
