version: '3.8'

services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: rehman_travels_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-rehman_travels_laravel_new}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-click123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - rehman_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-click123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # PostgreSQL Database (for new Django features)
  postgres:
    image: postgres:15-alpine
    container_name: rehman_travels_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rehman_travels_django
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rehman_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: rehman_travels_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - rehman_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Django Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehman_travels_web
    restart: on-failure:5
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEBUG=${DEBUG:-False}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-rehman_travels_laravel}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-click123}
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rehman_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Worker (for background tasks)
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehman_travels_celery
    restart: on-failure:5
    command: celery -A config worker -l info
    volumes:
      - .:/app
      - ./storage:/app/storage
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-rehman_travels_laravel}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-click123}
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - rehman_network
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rehman_travels_celery_beat
    restart: on-failure:5
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-rehman_travels_laravel}
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-click123}
      - DJANGO_DB_HOST=postgres
      - DJANGO_DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - rehman_network

# Networks
networks:
  rehman_network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local