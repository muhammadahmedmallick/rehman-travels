name: Deploy to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backen-alrehman/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Django App to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."

            # Navigate to application directory
            cd /home/ubuntu/rehman-travels/backen-alrehman

            # Check current branch
            echo "📍 Current directory: $(pwd)"
            echo "🌿 Current branch: $(git branch --show-current)"

            # Backup .env file before git reset
            echo "💾 Backing up .env file..."
            if [ -f ".env" ]; then
              cp .env .env.backup
              echo "✓ .env backed up"
            else
              echo "⚠️  No .env file found to backup"
            fi

            # Pull latest code from main branch
            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # Restore .env file after git reset
            echo "♻️  Restoring .env file..."
            if [ -f ".env.backup" ]; then
              mv .env.backup .env
              echo "✓ .env restored"
            else
              echo "❌ No .env backup found!"
              exit 1
            fi

            # Show latest commit
            echo "✅ Latest commit:"
            git log -1 --oneline

            # Check if docker-compose.yml exists
            if [ -f "docker-compose.yml" ]; then
              echo "🐳 Docker Compose file found"

              # Stop application containers only (keep db and redis running)
              echo "🛑 Stopping application containers..."
              docker-compose stop web celery celery-beat

              # Build new images
              echo "🔨 Building new images..."
              docker-compose build web celery celery-beat

              # Verify database is healthy
              echo "🔍 Checking database health..."
              if ! docker-compose ps db | grep -q "healthy"; then
                echo "⚠️  Database not healthy, starting it..."
                docker-compose up -d db redis
                echo "⏳ Waiting for database to be healthy..."
                sleep 20
              fi

              # Verify database connection
              echo "🔌 Testing database connection..."
              if docker exec rehman_travels_db bash -c "MYSQL_PWD=click123 mysql -udjango_user -e 'SELECT 1;'" > /dev/null 2>&1; then
                echo "✅ Database connection successful"
              else
                echo "❌ Database connection failed!"
                exit 1
              fi

              # Start application containers
              echo "🚀 Starting application containers..."
              docker-compose up -d web celery celery-beat

              # Wait for containers to be ready
              echo "⏳ Waiting for application containers..."
              sleep 15

              # Check if web container is running
              if ! docker ps | grep -q "rehman_travels_web"; then
                echo "❌ Web container failed to start!"
                echo "📋 Container logs:"
                docker-compose logs --tail=50 web
                exit 1
              fi

              # Run migrations
              echo "🔧 Running migrations..."
              docker-compose exec -T web python manage.py migrate --noinput || {
                echo "⚠️  Migration failed, checking logs..."
                docker-compose logs --tail=30 web
              }

              # Collect static files
              echo "📦 Collecting static files..."
              docker-compose exec -T web python manage.py collectstatic --noinput || {
                echo "⚠️  Static collection failed"
              }

              # Show running containers
              echo "📊 Running containers:"
              docker-compose ps

              # Show container health
              echo "🏥 Container health status:"
              docker ps --filter "name=rehman_travels" --format "table {{.Names}}\t{{.Status}}"

            else
              echo "❌ Docker Compose file not found!"
              exit 1
            fi

            # Check application health
            echo "🏥 Checking application health..."
            sleep 5

            # Test if application is responding
            RETRY_COUNT=0
            MAX_RETRIES=6
            
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:8000/admin/login/ > /dev/null 2>&1; then
                echo "✅ Application is responding!"
                break
              else
                RETRY_COUNT=$((RETRY_COUNT+1))
                if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                  echo "⏳ Waiting for application... (Attempt $RETRY_COUNT/$MAX_RETRIES)"
                  sleep 5
                else
                  echo "⚠️  Application health check failed after $MAX_RETRIES attempts"
                  echo "📋 Recent logs:"
                  docker-compose logs --tail=50 web
                fi
              fi
            done

            echo "🎉 Deployment completed!"

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi